services:
  balkan-book-drop:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: balkan-book-drop
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    # Uncomment to cap CPU cores on a shared host; unset lets converters use all available host cores.
    # cpus: 2.0
    mem_limit: 4g
    # Converters run untrusted books; keep them from gaining privileges or fork-bombing the host.
    init: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT
    volumes:
      - balkandownload-data:/usr/src/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: balkan-book-drop-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      balkan-book-drop:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  balkandownload-data:
