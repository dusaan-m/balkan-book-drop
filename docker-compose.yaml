services:
  book-drop:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: book-drop
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    # Uncomment to cap CPU cores on a shared host; unset lets converters use all available host cores.
    # cpus: 2.0
    mem_limit: 4g
    # Converters run untrusted books; keep them from gaining privileges or fork-bombing the host.
    init: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT
    volumes:
      - balkandownload-data:/usr/src/app/data

volumes:
  balkandownload-data:
